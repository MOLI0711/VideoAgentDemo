# Local HTTP entrypoint. Compose publishes this port only on 127.0.0.1:5173.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Video bytes go directly to signed S3 URLs; the API only receives JSON.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_cache off;

    location /v1/ {
        # No URI suffix: preserve /v1, query cursors, and all request headers.
        proxy_pass http://api:8080;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location = /readyz {
        proxy_pass http://api:8080;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
