name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags=integration ./internal/repository/mysql ./internal/api ./internal/agent
        env:
          VA_MYSQL_TEST_ADMIN_DSN: root:ci-ephemeral-only@tcp(127.0.0.1:3306)/mysql?parseTime=true&loc=UTC
      - run: python3 -m unittest discover -s eval
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run format:check && npm test && npm run build
